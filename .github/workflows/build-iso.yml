name: Build Femboy Linux ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'build.sh'
      - 'installer/**'
      - 'installed-system/**'
      - 'wallpapers/**'
      - '.github/workflows/build-iso.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed archiso git rsync sudo github-cli

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Mark checkout as a safe Git repository
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build ISO
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Show output
        run: |
          ls -lah out
          sha256sum out/*.iso

      - name: Publish ISO to rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          TAG="nightly"
          TITLE="Femboy Linux Nightly"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "$TITLE" \
              --notes "Automated Femboy Linux ISO build from the latest main branch." \
              --prerelease
          fi

          gh release upload "$TAG" out/*.iso out/*.sha256 --clobber
